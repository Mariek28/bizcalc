<!--
  This hidden file is required for Netlify Forms to work with
  static site generators. Netlify's build bot scans HTML files
  for form tags with data-netlify="true" to register them.
  
  The actual form UI is in src/app/contact/page.js
-->
<!DOCTYPE html>
<html>
<head><title>Form Detection</title></head>
<body>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="subject" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
